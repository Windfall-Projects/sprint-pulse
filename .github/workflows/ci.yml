name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.1.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Export Supabase Keys
        run: |
          # Supabase CLI outputs UTF-16, so we must strip null bytes and BOM first, then parse
          RAW_STATUS=$(supabase status -o json | tr -d '\000' | tr -d '\377' | tr -d '\376')

          # Extract and strip carriage returns
          API_URL=$(echo "$RAW_STATUS" | jq -r .API_URL | tr -d '\r')
          ANON_KEY=$(echo "$RAW_STATUS" | jq -r .ANON_KEY | tr -d '\r')
          SERVICE_ROLE_KEY=$(echo "$RAW_STATUS" | jq -r .SERVICE_ROLE_KEY | tr -d '\r')

          echo "SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV

      - name: Run Tests
        run: pnpm test
