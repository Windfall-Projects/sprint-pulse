name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.1.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Extract Supabase Keys
        run: |
          supabase status -o json > supabase_status_raw.json
          cat supabase_status_raw.json | tr -d '\000' | tr -d '\377' | tr -d '\376' > supabase_status.json
          echo "SUPABASE_URL=$(jq -r '.API_URL' supabase_status.json | tr -d '\r')" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' supabase_status.json | tr -d '\r')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' supabase_status.json | tr -d '\r')" >> $GITHUB_ENV

      - name: Run Tests
        run: pnpm test
