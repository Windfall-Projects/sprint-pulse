name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.1.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase
        run: supabase start

      - name: Grant service_role privileges
        run: supabase db query "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO service_role; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO service_role; GRANT ALL PRIVILEGES ON ALL ROUTINES IN SCHEMA public TO service_role;"

      - name: Extract Supabase Env
        run: supabase status -o env | grep -v "WARN:" | tr -d '"' | tr -d '\000' | tr -d '\377' | tr -d '\376' | tr -d '\r' >> $GITHUB_ENV

      - name: Run Tests
        run: pnpm test
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
